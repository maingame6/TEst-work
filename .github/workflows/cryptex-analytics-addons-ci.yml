name: CRYPTEX free analytics add-ons — isolated validation
on:
  push:
    branches: ['feature/cryptex-free-analytics-20261102']
  pull_request:
    branches: ['cryptex-paper-trading-preview']
    paths:
      - 'cryptex/overnight/analytics_addons.py'
      - 'cryptex/overnight/requirements-analytics.txt'
      - 'cryptex/overnight/tests/test_analytics_addons.py'
      - 'cryptex/overnight/overnight.html'
permissions:
  contents: read
jobs:
  read-only-analytics-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and standard-library safety tests
        run: |
          python -m py_compile cryptex/overnight/analytics_addons.py
          python -m unittest discover -s cryptex/overnight/tests -p 'test_analytics_addons.py' -v
      - name: Install optional free analysis libraries
        run: |
          python -m pip install --disable-pip-version-check -r cryptex/overnight/requirements-analytics.txt
          python -c 'import duckdb, quantstats; print("DuckDB and QuantStats imports OK")'
      - name: Read only saved paper data; emit isolated outputs
        run: |
          python cryptex/overnight/analytics_addons.py --data cryptex/overnight/data --output "$RUNNER_TEMP/cryptex-report" > "$RUNNER_TEMP/cryptex-analytics-stdout.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"cryptex-report"; j=json.loads((p/"analytics_summary.json").read_text()); assert j["mode"]=="PAPER_ONLY" and not j["real_money"]; assert j["equity_samples"]>=1; assert (p/"observations.duckdb").is_file(); print("Read-only analytics PASS; simulated equity records:",j["equity_samples"])'
