name: CRYPTEX - independent paper heartbeat watchdog

# Independent workflow/schedule, NOT independent infrastructure.
# Does not backfill market observations and never touches real money.
on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptex-watchdog.yml'
      - 'cryptex/ops/monitor.py'
      - 'cryptex/ops/tests/test_monitor.py'
      - 'cryptex/ops/host_guard.py'
      - 'cryptex/ops/tests/test_host_guard.py'
      - 'cryptex/ops/server_monitor.sh'
      - 'cryptex/ops/cryptex-server-monitor.service'
      - 'cryptex/ops/acceptance_audit.py'
      - 'cryptex/ops/tests/test_acceptance_audit.py'
      - 'cryptex/ops/parity_verifier.py'
      - 'cryptex/ops/tests/test_parity_verifier.py'
      - 'cryptex/ops/SPEC.md'
      - 'cryptex/ops/paper_dispatch_clock.py'
      - 'cryptex/ops/tests/test_paper_dispatch_clock.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: cryptex-heartbeat-watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout watchdog source from default branch
        uses: actions/checkout@v4
      - name: Checkout persisted paper state without modifying it
        uses: actions/checkout@v4
        with:
          ref: cryptex-paper-trading-preview
          path: paper-snapshot
          sparse-checkout: |
            cryptex/overnight/data/state.json
            cryptex/overnight/data/continuity_report.json
            cryptex/overnight/data/integrity_report.json
            cryptex/overnight/data/entry_study_report.json
            cryptex/overnight/data/portfolio_report.json
      - name: Checkout independent five-venue research report (read only)
        uses: actions/checkout@v4
        with:
          ref: cryptex-wide-market-research
          path: wide-snapshot
          sparse-checkout: |
            cryptex/overnight/data/wide_scan_report.json
            cryptex/overnight/data/forward_venue_report.json
            cryptex/overnight/data/microstructure_report.json
      - name: Test alert and safety rules
        run: python3 -m unittest discover -s cryptex/ops/tests -p 'test_*.py' -v
      - name: Examine independent heartbeat; recover if stale
        id: monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 cryptex/ops/monitor.py \
            --state paper-snapshot/cryptex/overnight/data/state.json \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --authority cryptex/ops/writer_authority.json \
            --wide wide-snapshot/cryptex/overnight/data/wide_scan_report.json \
            --output heartbeat.json --recover --recover-wide
      - name: Publish heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-watchdog-heartbeat
          path: heartbeat.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independently audit paper-only accounting, cadence, and five-venue evidence
        id: acceptance
        if: always()
        run: |
          python3 cryptex/ops/acceptance_audit.py \
            --state paper-snapshot/cryptex/overnight/data/state.json \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --integrity paper-snapshot/cryptex/overnight/data/integrity_report.json \
            --entry paper-snapshot/cryptex/overnight/data/entry_study_report.json \
            --wide wide-snapshot/cryptex/overnight/data/wide_scan_report.json \
            --forward wide-snapshot/cryptex/overnight/data/forward_venue_report.json \
            --depth wide-snapshot/cryptex/overnight/data/microstructure_report.json \
            --output acceptance.json
      - name: Publish CRYPTEX independent acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-acceptance-audit
          path: acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Confirmed-only evidence parity (no trading changes)
        id: parity
        if: always()
        run: |
          python3 cryptex/ops/parity_verifier.py --out parity-output
      - name: Publish SPEC, TEST_REPORT, PARITY_MATRIX, RUN and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-confirmed-evidence-parity
          path: |
            cryptex/ops/SPEC.md
            parity-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Expose watchdog failure to GitHub
        if: steps.monitor.outcome == 'failure'
        run: exit 1
