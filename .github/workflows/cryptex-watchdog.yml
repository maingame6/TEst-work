name: CRYPTEX - independent paper heartbeat watchdog

# Independent workflow/schedule, NOT independent infrastructure.
# Does not backfill market observations and never touches real money.
on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptex-watchdog.yml'
      - 'cryptex/ops/monitor.py'
      - 'cryptex/ops/tests/test_monitor.py'
      - 'cryptex/ops/host_guard.py'
      - 'cryptex/ops/tests/test_host_guard.py'
      - 'cryptex/ops/server_monitor.sh'
      - 'cryptex/ops/cryptex-server-monitor.service'
      - 'cryptex/ops/acceptance_audit.py'
      - 'cryptex/ops/tests/test_acceptance_audit.py'
      - 'cryptex/ops/parity_verifier.py'
      - 'cryptex/ops/tests/test_parity_verifier.py'
      - 'cryptex/ops/SPEC.md'
      - 'cryptex/ops/paper_dispatch_clock.py'
      - 'cryptex/ops/tests/test_paper_dispatch_clock.py'
      - 'cryptex/ops/depth_dispatch_guard.py'
      - 'cryptex/ops/tests/test_depth_dispatch_guard.py'
      - 'cryptex/ops/forward_feed_health.py'
      - 'cryptex/ops/tests/test_forward_feed_health.py'
      - 'cryptex/ops/heldout_gate.py'
      - 'cryptex/ops/own_data_review.py'
      - 'cryptex/ops/tests/test_own_data_review.py'
      - 'cryptex/ops/cadence_evidence.py'
      - 'cryptex/ops/tests/test_cadence_evidence.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: cryptex-heartbeat-watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout watchdog source from default branch
        uses: actions/checkout@v4
      - name: Checkout persisted paper state without modifying it
        uses: actions/checkout@v4
        with:
          ref: cryptex-paper-trading-preview
          path: paper-snapshot
          sparse-checkout: |
            cryptex/overnight/data/state.json
            cryptex/overnight/data/continuity_report.json
            cryptex/overnight/data/integrity_report.json
            cryptex/overnight/data/entry_study_report.json
            cryptex/overnight/data/portfolio_report.json
            cryptex/overnight/data/trades.csv
      - name: Checkout independent five-venue research report (read only)
        uses: actions/checkout@v4
        with:
          ref: cryptex-wide-market-research
          path: wide-snapshot
          sparse-checkout: |
            cryptex/overnight/data/wide_scan_report.json
            cryptex/overnight/data/forward_venue_report.json
            cryptex/overnight/data/microstructure_report.json
            cryptex/overnight/data/forward_threshold_report.json
            cryptex/overnight/data/microstructure_snapshots.csv
      - name: Test alert and safety rules
        run: python3 -m unittest discover -s cryptex/ops/tests -p 'test_*.py' -v
      - name: Examine independent heartbeat; recover if stale
        id: monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 cryptex/ops/monitor.py \
            --state paper-snapshot/cryptex/overnight/data/state.json \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --authority cryptex/ops/writer_authority.json \
            --wide wide-snapshot/cryptex/overnight/data/wide_scan_report.json \
            --depth wide-snapshot/cryptex/overnight/data/microstructure_report.json \
            --output heartbeat.json --recover --recover-wide --recover-depth
      - name: Publish heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-watchdog-heartbeat
          path: heartbeat.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independently audit paper-only accounting, cadence, and five-venue evidence
        id: acceptance
        if: always()
        run: |
          python3 cryptex/ops/acceptance_audit.py \
            --state paper-snapshot/cryptex/overnight/data/state.json \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --integrity paper-snapshot/cryptex/overnight/data/integrity_report.json \
            --entry paper-snapshot/cryptex/overnight/data/entry_study_report.json \
            --wide wide-snapshot/cryptex/overnight/data/wide_scan_report.json \
            --forward wide-snapshot/cryptex/overnight/data/forward_venue_report.json \
            --depth wide-snapshot/cryptex/overnight/data/microstructure_report.json \
            --output acceptance.json
      - name: Publish CRYPTEX independent acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-acceptance-audit
          path: acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Confirmed-only evidence parity (no trading changes)
        id: parity
        if: always()
        run: |
          python3 cryptex/ops/parity_verifier.py --out parity-output
      - name: Publish SPEC, TEST_REPORT, PARITY_MATRIX, RUN and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-confirmed-evidence-parity
          path: |
            cryptex/ops/SPEC.md
            parity-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Review own recorded strategy and market data (read only)
        if: always()
        run: |
          python3 cryptex/ops/own_data_review.py \
            --trades paper-snapshot/cryptex/overnight/data/trades.csv \
            --books wide-snapshot/cryptex/overnight/data/microstructure_snapshots.csv \
            --study paper-snapshot/cryptex/overnight/data/entry_study_report.json \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --portfolio paper-snapshot/cryptex/overnight/data/portfolio_report.json \
            --wide-report wide-snapshot/cryptex/overnight/data/wide_scan_report.json \
            --forward-report wide-snapshot/cryptex/overnight/data/forward_venue_report.json \
            --threshold-report wide-snapshot/cryptex/overnight/data/forward_threshold_report.json \
            --out research-output
      - name: Publish own-data report and research assumptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-own-data-review
          path: research-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Audit fixed held-out after-cost promotion requirements
        if: always()
        run: |
          python3 cryptex/ops/heldout_gate.py \
            --entry paper-snapshot/cryptex/overnight/data/entry_study_report.json \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --depth wide-snapshot/cryptex/overnight/data/microstructure_report.json \
            --out research-output
      - name: Archive held-out decision with own-data review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-heldout-decision
          path: research-output/heldout_decision.json
          if-no-files-found: warn
          retention-days: 14
      - name: Measure post-fix actual 5m cadence and sampled GitHub run jitter
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method GET \
            "repos/$GH_REPO/actions/workflows/cryptex-paper.yml/runs?per_page=100" > "$RUNNER_TEMP/cryptex_paper_runs.json"
          python3 cryptex/ops/cadence_evidence.py \
            --continuity paper-snapshot/cryptex/overnight/data/continuity_report.json \
            --runs "$RUNNER_TEMP/cryptex_paper_runs.json" \
            --out cadence-output
      - name: Publish frozen post-fix reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-cadence-postfix
          path: cadence-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Audit frozen after-fix 15m market research feed separately
        if: always()
        run: |
          python3 cryptex/ops/forward_feed_health.py \
            --report wide-snapshot/cryptex/overnight/data/forward_threshold_report.json \
            --out feed-output
      - name: Publish independent research feed-quality artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-forward-feed-quality
          path: feed-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Expose watchdog failure to GitHub
        if: steps.monitor.outcome == 'failure'
        run: exit 1
