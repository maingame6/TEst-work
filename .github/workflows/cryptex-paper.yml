name: CRYPTEX — scheduled paper-market research

# Scheduled event files must live on the repository's default branch.
# This workflow checks out a separate CRYPTEX research branch; it does not
# modify or deploy the site's production code. NO REAL ORDERS OR KEYS.
# Re-register Github schedule with staggered non-round minutes. The actor is
# reset by this commit (GitHub's recommended cron recovery). Best-effort:
# GitHub may still delay/drop schedule events; inspect last_schedule_run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptex-paper.yml'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptex-scheduled-paper-research
  cancel-in-progress: false

jobs:
  observe-and-paper-trade:
    name: Observe markets and journal paper trades
    if: github.repository == 'maingame6/TEst-work'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRYPTEX_TRIGGER_EVENT: ${{ github.event_name }}
    steps:
      - name: Check out isolated CRYPTEX branch
        uses: actions/checkout@v4
        with:
          ref: cryptex-paper-trading-preview
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run market safety compile and single research cycle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile cryptex/overnight/runner.py
          python3 -m py_compile cryptex/overnight/subagents.py
          python3 -m py_compile cryptex/overnight/research_math.py
          python3 -m py_compile cryptex/overnight/research_flock.py
          python3 -m py_compile cryptex/overnight/research_shadow.py
          python3 -m py_compile cryptex/overnight/portfolio_report.py
          python3 -m unittest discover -s cryptex/overnight/tests -v
          python3 cryptex/overnight/runner.py

      - name: Save paper state, entries, exits and equity to GitHub
        if: success()
        run: |
          git config user.name "cryptex-paper-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cryptex/overnight/data/state.json
          git add -f cryptex/overnight/data/trades.csv
          git add -f cryptex/overnight/data/decisions.csv
          git add -f cryptex/overnight/data/subagent_decisions.csv
          git add -f cryptex/overnight/data/shadow_state.json
          git add -f cryptex/overnight/data/shadow_trades.csv
          git add -f cryptex/overnight/data/shadow_decisions.csv
          git add -f cryptex/overnight/data/shadow_review.json
          git add -f cryptex/overnight/data/shadow_review.md
          git add -f cryptex/overnight/data/portfolio_report.json
          git add -f cryptex/overnight/data/combined_equity.csv
          git add -f cryptex/overnight/data/overnight_sessions.json
          git add -f cryptex/overnight/data/morning_report.md
          git add -f cryptex/overnight/data/public_research.json
          git add -f cryptex/overnight/data/equity.csv
          git add -f cryptex/overnight/data/review.json
          git add -f cryptex/overnight/data/review.md
          if git diff --cached --quiet; then
            echo "No journal updates."
            exit 0
          fi
          git commit -m "research: append CRYPTEX market observation and simulated results [skip ci]"
          git push origin HEAD:cryptex-paper-trading-preview
