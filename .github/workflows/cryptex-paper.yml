name: CRYPTEX — scheduled paper-market research

# Scheduled event files must live on the repository's default branch.
# This workflow checks out a separate CRYPTEX research branch; it does not
# modify or deploy the site's production code. NO REAL ORDERS OR KEYS.
# Validate restored research-state migration and prospective benchmark P&L.
# Re-register Github schedule with staggered non-round minutes. The actor is
# reset by this commit (GitHub's recommended cron recovery). Best-effort:
# GitHub may still delay/drop schedule events; inspect last_schedule_run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptex-paper.yml'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
    inputs:
      autopilot:
        description: 'Bounded nine-day paper-only 24-hour fallback'
        type: boolean
        required: false
        default: false
      hop:
        description: 'Internal bounded fallback counter, max 2650'
        type: number
        required: false
        default: 0

permissions:
  contents: write
  actions: write  # Supported explicit workflow_dispatch permission

concurrency:
  group: cryptex-scheduled-paper-research
  cancel-in-progress: false

jobs:
  observe-and-paper-trade:
    name: Observe markets and journal paper trades
    if: github.repository == 'maingame6/TEst-work'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRYPTEX_TRIGGER_EVENT: ${{ github.event_name }}
      CRYPTEX_AUTOPILOT: ${{ inputs.autopilot }}
    steps:
      - name: Check out isolated CRYPTEX branch
        uses: actions/checkout@v4
        with:
          ref: cryptex-paper-trading-preview
          fetch-depth: 0


      - name: Checkout paper-writer authority from default branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: authority-snapshot
          persist-credentials: false
          sparse-checkout: |
            cryptex/ops/writer_authority.json
            cryptex/ops/writer_control.py
            cryptex/ops/paper_dispatch_clock.py
            cryptex/ops/depth_dispatch_guard.py

      - name: Verify GitHub is current owner before processing any market
        id: writer_preflight
        run: |
          python3 authority-snapshot/cryptex/ops/writer_control.py decision \
            --file authority-snapshot/cryptex/ops/writer_authority.json \
            --actor github --output "$GITHUB_OUTPUT"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CCXT supplies exchange-wide instrument CATALOGUES, not executable prices.
      # Install only if the last successful discovery is >=6h old; this does
      # not burden each 5-minute paper-trading execution with a package install.
      - name: Optional CCXT multi-exchange market discovery (read-only)
        if: steps.writer_preflight.outputs.authorized == 'true'
        shell: bash
        run: |
          if python3 cryptex/overnight/ccxt_universe.py --due; then
            echo "Refreshing the public multi-exchange spot catalogue"
            if python3 -m pip install --quiet --disable-pip-version-check 'ccxt==4.5.81'; then
              python3 cryptex/overnight/ccxt_universe.py --refresh || echo "::warning::CCXT public discovery unavailable; trading remains unaffected"
            else
              echo "::warning::CCXT installation unavailable; core paper trading continues"
            fi
          else
            echo "Using last verified CCXT catalogue; less than 6h old"
          fi

      # Only genuine paper engine/journal/accounting safety regressions can
      # block the automated trading experiment. Optional UI/market-research
      # fixtures are separately visible and cannot kill the overnight chain.
      - name: Critical paper strategy and accounting safety tests
        if: steps.writer_preflight.outputs.authorized == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile cryptex/overnight/runner.py cryptex/overnight/subagents.py cryptex/overnight/execution_gate.py cryptex/overnight/continuity.py
          python3 -m py_compile cryptex/overnight/research_math.py cryptex/overnight/research_flock.py
          python3 -m py_compile cryptex/overnight/research_shadow.py cryptex/overnight/entry_study.py cryptex/overnight/cost_model.py
          python3 -m py_compile cryptex/overnight/portfolio_report.py cryptex/overnight/integrity_audit.py
          python3 -m unittest discover -s cryptex/overnight/tests -p test_runner.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_execution_gate.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_continuity.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_research.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_portfolio_report.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_integrity_audit.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_cost_model.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_entry_study.py -v

      - name: Optional cross-market and morning presentation tests
        if: steps.writer_preflight.outputs.authorized == 'true'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile cryptex/overnight/morning_briefing.py
          python3 -m py_compile cryptex/overnight/market_radar.py cryptex/overnight/ccxt_universe.py
          python3 -m unittest discover -s cryptex/overnight/tests -p test_morning_briefing.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_market_radar.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_ccxt_universe.py -v

      - name: Trade on completed paper candles and verify 21 account balances
        if: steps.writer_preflight.outputs.authorized == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 cryptex/overnight/runner.py
          # Do not publish false paper-money totals. Missing third-party
          # research feeds are reported as warnings, not invented prices.
          python3 cryptex/overnight/integrity_audit.py cryptex/overnight/data


      - name: Refresh authority and fence any takeover before publishing
        id: writer_commit
        if: steps.writer_preflight.outputs.authorized == 'true'
        env:
          WRITER_EPOCH: ${{ steps.writer_preflight.outputs.epoch }}
        run: |
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:cryptex/ops/writer_authority.json > "$RUNNER_TEMP/cryptex_authority_latest.json"
          python3 authority-snapshot/cryptex/ops/writer_control.py decision \
            --file "$RUNNER_TEMP/cryptex_authority_latest.json" \
            --actor github --epoch "$WRITER_EPOCH" --output "$GITHUB_OUTPUT"

      - name: Save paper state, entries, exits and equity to GitHub
        if: success() && steps.writer_commit.outputs.authorized == 'true'
        env:
          WRITER_EPOCH: ${{ steps.writer_preflight.outputs.epoch }}
        run: |
          git config user.name "cryptex-paper-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cryptex/overnight/data/state.json
          git add -f cryptex/overnight/data/trades.csv
          git add -f cryptex/overnight/data/decisions.csv
          git add -f cryptex/overnight/data/subagent_decisions.csv
          git add -f cryptex/overnight/data/shadow_state.json
          git add -f cryptex/overnight/data/shadow_trades.csv
          git add -f cryptex/overnight/data/shadow_decisions.csv
          git add -f cryptex/overnight/data/shadow_review.json
          git add -f cryptex/overnight/data/shadow_review.md
          git add -f cryptex/overnight/data/portfolio_report.json
          git add -f cryptex/overnight/data/continuity_report.json
          git add -f cryptex/overnight/data/continuity_report.md
          for path in cryptex/overnight/data/entry_study_state.json cryptex/overnight/data/entry_study_report.json cryptex/overnight/data/entry_study_report.md; do
            if test -f "$path"; then git add -f "$path"; else echo "::warning::Optional entry study missing: $path"; fi
          done
          git add -f cryptex/overnight/data/integrity_report.json
          git add -f cryptex/overnight/data/benchmark_reference.json
          # The independently-funded $30 virtual market demo is optional and
          # must never alter the $210 official strategy ledger or stop its run.
          if test -f cryptex/overnight/data/market_demo_equity.csv; then
            git add -f cryptex/overnight/data/market_demo_equity.csv
          else
            echo "::notice::Market demo has not yet recorded a fresh complete candle"
          fi
          git add -f cryptex/overnight/data/combined_equity.csv
          git add -f cryptex/overnight/data/overnight_sessions.json
          git add -f cryptex/overnight/data/morning_report.md
          # The briefing is an observational report: a failure is explicitly
          # flagged in state.json, never allowed to stop core paper trading.
          for path in cryptex/overnight/data/morning_briefing.md cryptex/overnight/data/morning_briefing.json cryptex/overnight/data/morning_market_baselines.json; do
            if test -f "$path"; then git add -f "$path"; else echo "::warning::Missing optional extended debrief: $path"; fi
          done
          git add -f cryptex/overnight/data/public_research.json
          if test -f cryptex/overnight/data/ccxt_universe.json; then
            git add -f cryptex/overnight/data/ccxt_universe.json
          else
            echo "::notice::Multi-exchange CCXT catalogue has not yet published"
          fi
          for path in cryptex/overnight/data/market_radar.json cryptex/overnight/data/market_radar_catalog.json cryptex/overnight/data/market_radar_snapshots.csv; do
            if test -f "$path"; then git add -f "$path"; else echo "::warning::Missing optional market radar: $path"; fi
          done
          git add -f cryptex/overnight/data/equity.csv
          git add -f cryptex/overnight/data/review.json
          git add -f cryptex/overnight/data/review.md
          if git diff --cached --quiet; then
            echo "No journal updates."
            exit 0
          fi
          git commit -m "research: append CRYPTEX market observation and simulated results [skip ci]"
          # If a human updates documentation or experiments while a run is
          # executing, retry by replaying the commit without force-pushing.
          # A DATA conflict fails safely; no journal is silently overwritten.
          # Revalidate against freshly fetched MAIN. A drain or server takeover
          # must never allow a queued GitHub run to publish simulated trades.
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:cryptex/ops/writer_authority.json > "$RUNNER_TEMP/cryptex_authority_latest.json"
          python3 authority-snapshot/cryptex/ops/writer_control.py assert-owner \
            --file "$RUNNER_TEMP/cryptex_authority_latest.json" \
            --actor github --epoch "$WRITER_EPOCH"
          # Refuse a non-fast-forward. Rebase of independent paper decisions
          # could silently introduce an invalid or duplicated money history.
          if ! git push origin HEAD:cryptex-paper-trading-preview; then
            echo "::error::Paper ledger advanced concurrently; refuse rebase, do not overwrite."
            exit 1
          fi

      # Keep optional 5-venue snapshots moving when native Github 15m cron
      # is dropped. This ONLY dispatches a separate public research workflow,
      # never fetches exchange credentials, trades or writes paper accounts.
      - name: Request overdue public five-exchange evidence if safe
        if: success() && steps.writer_commit.outputs.authorized == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 authority-snapshot/cryptex/ops/depth_dispatch_guard.py

      # GitHub cron is best effort. A bounded fallback runs all day through
      # the 7+ day research window; never trades real money, never runs forever.
      - name: Nine-day evidence pilot - continuous paper-only fallback
        if: success() && steps.writer_commit.outputs.authorized == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRYPTEX_EVENT: ${{ github.event_name }}
          CRYPTEX_AUTOPILOT: ${{ inputs.autopilot }}
          CRYPTEX_HOP: ${{ inputs.hop }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json,os,pathlib,subprocess,time,sys
          sys.path.insert(0,"authority-snapshot/cryptex/ops")
          from paper_dispatch_clock import next_dispatch_delay
          event=os.environ.get("CRYPTEX_EVENT","")
          requested=os.environ.get("CRYPTEX_AUTOPILOT","false").lower()=="true"
          hop=int(os.environ.get("CRYPTEX_HOP") or "0")
          state=json.loads(pathlib.Path("cryptex/overnight/data/state.json").read_text())
          if state.get("mode")!="PAPER_ONLY":
              raise SystemExit("No real-money fallback permitted")
          MAX_HOPS=2650
          DEADLINE=dt.datetime(2026,11,10,0,0,tzinfo=dt.timezone.utc)
          now=dt.datetime.now(dt.timezone.utc)
          if now>=DEADLINE or hop>=MAX_HOPS:
              print("Bounded evidence run ended; no self-dispatch")
              raise SystemExit(0)
          def age_seconds(timestamp):
              try:
                  return (now-dt.datetime.fromisoformat(timestamp.replace("Z","+00:00"))).total_seconds()
              except (AttributeError,ValueError,TypeError):
                  return float("inf")
          if event=="workflow_dispatch" and not requested:
              print("One-time dispatch only, no autopilot requested")
              raise SystemExit(0)
          if event in ("schedule","push"):
              # A failed GitHub push can break the bounded dispatch chain.
              # A changed-workflow push may safely bootstrap it again, but only
              # if the persisted heartbeat proves no recent autopilot run.
              if age_seconds(state.get("last_autopilot_dispatch"))<600:
                  print("Autopilot heartbeat present: skip duplicate chain")
                  raise SystemExit(0)
              if event=="schedule" and age_seconds(state.get("previous_native_cron_run"))<=600:
                  print("Multiple recent genuine cron runs: backup not needed")
                  raise SystemExit(0)
              print("Genuine cron/push recovery: start bounded PAPER_ONLY chain")
          if event not in ("schedule","workflow_dispatch","push"):
              raise SystemExit("Invalid event for recovery chain")
          # A single native cron run does not end the bounded recovery chain.
          # Concurrent jobs share a repo-level lock; candle processing is idempotent.
          # CRITICAL: fixed sleep AFTER the runner caused a 305-315s loop
          # and slowly skipped genuine 300s candles. Re-anchor each future
          # dispatch to the actual last completed 5m candle timestamp.
          delay,target=next_dispatch_delay(state.get("last_ts"),now)
          print(f"Next actual candle-aligned dispatch: {target}, delay {delay}s",flush=True)
          if now+dt.timedelta(seconds=delay+60)>=DEADLINE:
              print("Near deadline; not dispatching another run")
              raise SystemExit(0)
          print(f"24h PAPER_ONLY hop {hop}/{MAX_HOPS}; aligned target {target}, next in {delay}s",flush=True)
          time.sleep(delay)
          if dt.datetime.now(dt.timezone.utc)>=DEADLINE:
              raise SystemExit("Evidence deadline reached during wait")
          # Authority may change during the 275-second delay: do not schedule
          # a new GitHub writer when the host handover has entered DRAIN.
          subprocess.run(["git","fetch","--quiet","--no-tags","origin",
              "+refs/heads/main:refs/remotes/origin/main"],check=True)
          ownership=json.loads(subprocess.check_output(["git","show",
              "origin/main:cryptex/ops/writer_authority.json"],text=True))
          if (ownership.get("mode")!="PAPER_ONLY"
                  or ownership.get("writer")!="github"):
              print("Writer is no longer Github: stop chained dispatch")
              raise SystemExit(0)
          cmd=["gh","api","-X","POST",
              f"repos/{os.environ['GH_REPO']}/actions/workflows/cryptex-paper.yml/dispatches",
              "-f","ref=main","-f","inputs[autopilot]=true",
              "-f",f"inputs[hop]={hop+1}"]
          for attempt in range(3):
              try:
                  subprocess.run(cmd,check=True,timeout=30)
                  print(f"Next PAPER_ONLY run dispatched, hop {hop+1}/{MAX_HOPS}")
                  break
              except (subprocess.CalledProcessError,subprocess.TimeoutExpired) as exc:
                  if attempt==2:
                      raise RuntimeError("Three dispatch failures; future cron must recover") from exc
                  time.sleep(5*(attempt+1))
          PY
