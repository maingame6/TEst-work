name: CRYPTEX — scheduled paper-market research

# Scheduled event files must live on the repository's default branch.
# This workflow checks out a separate CRYPTEX research branch; it does not
# modify or deploy the site's production code. NO REAL ORDERS OR KEYS.
# Validate restored research-state migration and prospective benchmark P&L.
# Re-register Github schedule with staggered non-round minutes. The actor is
# reset by this commit (GitHub's recommended cron recovery). Best-effort:
# GitHub may still delay/drop schedule events; inspect last_schedule_run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptex-paper.yml'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
    inputs:
      autopilot:
        description: 'Bounded overnight paper-research fallback (no live money)'
        type: boolean
        required: false
        default: false
      hop:
        description: 'Internal bounded fallback counter, max 132'
        type: number
        required: false
        default: 0

permissions:
  contents: write
  actions: write  # Supported explicit workflow_dispatch permission

concurrency:
  group: cryptex-scheduled-paper-research
  cancel-in-progress: false

jobs:
  observe-and-paper-trade:
    name: Observe markets and journal paper trades
    if: github.repository == 'maingame6/TEst-work'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CRYPTEX_TRIGGER_EVENT: ${{ github.event_name }}
    steps:
      - name: Check out isolated CRYPTEX branch
        uses: actions/checkout@v4
        with:
          ref: cryptex-paper-trading-preview
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CCXT supplies exchange-wide instrument CATALOGUES, not executable prices.
      # Install only if the last successful discovery is >=6h old; this does
      # not burden each 5-minute paper-trading execution with a package install.
      - name: Optional CCXT multi-exchange market discovery (read-only)
        shell: bash
        run: |
          if python3 cryptex/overnight/ccxt_universe.py --due; then
            echo "Refreshing the public multi-exchange spot catalogue"
            if python3 -m pip install --quiet --disable-pip-version-check 'ccxt==4.5.81'; then
              python3 cryptex/overnight/ccxt_universe.py --refresh || echo "::warning::CCXT public discovery unavailable; trading remains unaffected"
            else
              echo "::warning::CCXT installation unavailable; core paper trading continues"
            fi
          else
            echo "Using last verified CCXT catalogue; less than 6h old"
          fi

      # Only genuine paper engine/journal/accounting safety regressions can
      # block the automated trading experiment. Optional UI/market-research
      # fixtures are separately visible and cannot kill the overnight chain.
      - name: Critical paper strategy and accounting safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile cryptex/overnight/runner.py cryptex/overnight/subagents.py cryptex/overnight/execution_gate.py cryptex/overnight/continuity.py
          python3 -m py_compile cryptex/overnight/research_math.py cryptex/overnight/research_flock.py
          python3 -m py_compile cryptex/overnight/research_shadow.py
          python3 -m py_compile cryptex/overnight/portfolio_report.py cryptex/overnight/integrity_audit.py
          python3 -m unittest discover -s cryptex/overnight/tests -p test_runner.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_execution_gate.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_continuity.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_research.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_portfolio_report.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_integrity_audit.py -v

      - name: Optional cross-market and morning presentation tests
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile cryptex/overnight/morning_briefing.py
          python3 -m py_compile cryptex/overnight/market_radar.py cryptex/overnight/ccxt_universe.py
          python3 -m unittest discover -s cryptex/overnight/tests -p test_morning_briefing.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_market_radar.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_ccxt_universe.py -v

      - name: Trade on completed paper candles and verify 21 account balances
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 cryptex/overnight/runner.py
          # Do not publish false paper-money totals. Missing third-party
          # research feeds are reported as warnings, not invented prices.
          python3 cryptex/overnight/integrity_audit.py cryptex/overnight/data

      - name: Save paper state, entries, exits and equity to GitHub
        if: success()
        run: |
          git config user.name "cryptex-paper-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cryptex/overnight/data/state.json
          git add -f cryptex/overnight/data/trades.csv
          git add -f cryptex/overnight/data/decisions.csv
          git add -f cryptex/overnight/data/subagent_decisions.csv
          git add -f cryptex/overnight/data/shadow_state.json
          git add -f cryptex/overnight/data/shadow_trades.csv
          git add -f cryptex/overnight/data/shadow_decisions.csv
          git add -f cryptex/overnight/data/shadow_review.json
          git add -f cryptex/overnight/data/shadow_review.md
          git add -f cryptex/overnight/data/portfolio_report.json
          git add -f cryptex/overnight/data/continuity_report.json
          git add -f cryptex/overnight/data/continuity_report.md
          git add -f cryptex/overnight/data/integrity_report.json
          git add -f cryptex/overnight/data/benchmark_reference.json
          git add -f cryptex/overnight/data/combined_equity.csv
          git add -f cryptex/overnight/data/overnight_sessions.json
          git add -f cryptex/overnight/data/morning_report.md
          # The briefing is an observational report: a failure is explicitly
          # flagged in state.json, never allowed to stop core paper trading.
          for path in cryptex/overnight/data/morning_briefing.md cryptex/overnight/data/morning_briefing.json cryptex/overnight/data/morning_market_baselines.json; do
            if test -f "$path"; then git add -f "$path"; else echo "::warning::Missing optional extended debrief: $path"; fi
          done
          git add -f cryptex/overnight/data/public_research.json
          if test -f cryptex/overnight/data/ccxt_universe.json; then
            git add -f cryptex/overnight/data/ccxt_universe.json
          else
            echo "::notice::Multi-exchange CCXT catalogue has not yet published"
          fi
          for path in cryptex/overnight/data/market_radar.json cryptex/overnight/data/market_radar_catalog.json cryptex/overnight/data/market_radar_snapshots.csv; do
            if test -f "$path"; then git add -f "$path"; else echo "::warning::Missing optional market radar: $path"; fi
          done
          git add -f cryptex/overnight/data/equity.csv
          git add -f cryptex/overnight/data/review.json
          git add -f cryptex/overnight/data/review.md
          if git diff --cached --quiet; then
            echo "No journal updates."
            exit 0
          fi
          git commit -m "research: append CRYPTEX market observation and simulated results [skip ci]"
          # If a human updates documentation or experiments while a run is
          # executing, retry by replaying the commit without force-pushing.
          # A DATA conflict fails safely; no journal is silently overwritten.
          if ! git push origin HEAD:cryptex-paper-trading-preview; then
            echo "Research branch moved while this job ran; attempting safe non-force rebase"
            git fetch origin cryptex-paper-trading-preview
            git -c rebase.autoStash=false rebase origin/cryptex-paper-trading-preview
            git push origin HEAD:cryptex-paper-trading-preview
          fi

      # Github cron is best-effort; bounded overnight self-dispatch fallback.
      # Stop only AFTER the first verified morning paper-balance snapshot (up to 08:15 Dublin),
      # after 132 hops; do not stop on a single unreliable cron event.
      # Public standard Github-hosted runners are free, subject to fair use.
      - name: Overnight backup — self-dispatch next paper cycle
        # Only arm backup on a real cron outage, explicit autopilot or workflow repair.
        # A healthy native cron never spawns a redundant overnight chain.
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRYPTEX_EVENT: ${{ github.event_name }}
          CRYPTEX_AUTOPILOT: ${{ inputs.autopilot }}
          CRYPTEX_HOP: ${{ inputs.hop }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import time
          from zoneinfo import ZoneInfo

          event=os.environ.get("CRYPTEX_EVENT","")
          hop=int(os.environ.get("CRYPTEX_HOP") or "0")
          requested=os.environ.get("CRYPTEX_AUTOPILOT","false").lower()=="true"
          state=json.loads(pathlib.Path("cryptex/overnight/data/state.json").read_text())
          if state.get("mode")!="PAPER_ONLY":
              raise SystemExit("Refusing non-paper-money research dispatch")
          if event=="workflow_dispatch" and not requested:
              print("Manual research run, autonomous fallback not requested")
              raise SystemExit(0)
          if event=="schedule":
              # The runner kept the PREVIOUS genuine first-attempt cron time.
              # Recovery starts only when it proves a >10-minute outage.
              previous=state.get("previous_native_cron_run")
              now=dt.datetime.now(dt.timezone.utc)
              try:
                  previous_time=dt.datetime.fromisoformat(previous.replace("Z","+00:00"))
                  missing_for=(now-previous_time).total_seconds()
              except (AttributeError,TypeError,ValueError):
                  missing_for=float("inf")
              if missing_for<=600:
                  print(f"Native schedule healthy ({missing_for:.0f}s since preceding run); no backup")
                  raise SystemExit(0)
              print(f"Native schedule outage ({missing_for:.0f}s): arming bounded backup")
          if event not in ("push","workflow_dispatch","schedule") or hop>=132:
              print("Backup stopped: invalid source or 132-cycle limit")
              raise SystemExit(0)

          # A SINGLE native cron event does not prove dependable future
          # scheduling. The bounded backup keeps going to the morning
          # checkpoint. The runner is idempotent on closed-candle timestamp,
          # and GitHub concurrency serializes any overlapping triggers.
          if state.get("schedule_confirmed"):
              print("Native cron seen; retaining backup until the morning checkpoint")
          local=dt.datetime.now(ZoneInfo("Europe/Dublin"))
          def morning_done():
              try:
                  sessions=json.loads(pathlib.Path("cryptex/overnight/data/overnight_sessions.json").read_text())
                  return bool(sessions and sessions[-1].get("morning") is not None)
              except (ValueError,OSError,KeyError,TypeError):
                  return False
          def overnight_window(t):
              return t.hour>=21 or t.hour<8 or (t.hour==8 and t.minute<15 and not morning_done())
          if not overnight_window(local):
              print("Outside overnight research window or first morning report already captured")
              raise SystemExit(0)

          # Existing recovery is confined to the overnight evidence window.
          # GitHub Actions is best effort; this is not a guaranteed 5m clock.
          delay=45 if event=="push" else 285
          started=dt.datetime.now(dt.timezone.utc)
          print(f"Paper-only overnight backup hop {hop}; next dispatch in {delay}s",flush=True)
          time.sleep(delay)
          local=dt.datetime.now(ZoneInfo("Europe/Dublin"))
          if not overnight_window(local):
              print("Morning snapshot captured / 08:15 cutoff reached; no further backup")
              raise SystemExit(0)
          # Check the latest COMMITTED state, not this run's stale checkout:
          # a genuine native cron since backup began makes this dispatch redundant.
          try:
              subprocess.run(["git","fetch","-q","origin","cryptex-paper-trading-preview"],
                             check=True,timeout=30)
              latest=json.loads(subprocess.check_output([
                  "git","show","origin/cryptex-paper-trading-preview:cryptex/overnight/data/state.json"
              ],timeout=15,text=True))
              recent=latest.get("last_native_cron_run")
              recent_time=dt.datetime.fromisoformat(recent.replace("Z","+00:00")) if recent else None
              if recent_time and recent_time>started+dt.timedelta(seconds=20):
                  print("Fresh native cron observed since fallback started; stopping redundant dispatch")
                  raise SystemExit(0)
          except (subprocess.CalledProcessError,subprocess.TimeoutExpired,ValueError,TypeError) as exc:
              print(f"::warning::Could not verify recent cron ({exc}); continue bounded fallback")
          subprocess.run([
              "gh","api","-X","POST",
              f"repos/{os.environ['GH_REPO']}/actions/workflows/cryptex-paper.yml/dispatches",
              "-f","ref=main",
              "-f","inputs[autopilot]=true",
              "-f",f"inputs[hop]={hop+1}"
          ],check=True,timeout=30)
          print(f"Next paper cycle dispatched, hop {hop+1}/132.")
          PY
