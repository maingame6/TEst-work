name: CRYPTEX - five-exchange market tests (paper history)

# This is a SEPARATE historical scanner, not the $210 paper wallet runner.
# Actual 5m OHLCV is fetched from each named exchange via public CCXT only.
# GitHub cron is best-effort; missing runs MUST NOT be marked as completed.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cryptex-wide-scan.yml']
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      autopilot:
        type: boolean
        required: false
        default: false
        description: 'Continue bounded five-venue paper test coverage'
      hop:
        type: number
        required: false
        default: 0
        description: 'Recovery scan counter; no live trading'
      force_rescan:
        type: boolean
        required: false
        default: false
        description: 'Explicitly repeat after complete first-pass coverage'

permissions:
  contents: write
  actions: write

concurrency:
  group: cryptex-five-venue-historical-research
  cancel-in-progress: false

jobs:
  evaluate-real-public-candles:
    if: github.repository == 'maingame6/TEst-work'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Check out tested strategy source
        uses: actions/checkout@v4
        with:
          ref: cryptex-paper-trading-preview
          fetch-depth: 1
      - name: Check out SEPARATE wide-market results branch
        uses: actions/checkout@v4
        with:
          ref: cryptex-wide-market-research
          fetch-depth: 1
          path: wide-output
      - name: Stop expensive scans when initial catalogue coverage is complete
        id: coverage_gate
        env:
          FORCE_RESCAN: ${{ inputs.force_rescan }}
        run: |
          python3 - <<'PY'
          import datetime as dt,json,os,pathlib
          report=pathlib.Path("wide-output/cryptex/overnight/data/wide_scan_report.json")
          done=False
          failed=0
          due=False
          if report.exists():
              a=json.loads(report.read_text())
              assert a.get("mode")=="PAPER_ONLY" and a.get("not_real_orders") is True
              done=int(a["unique_tested_venue_pairs"])>=int(a["discovered_listing_total"])
              failed=sum(x.get("latest_failed",0) for x in a.get("venues",{}).values())
              last=dt.datetime.fromisoformat(a["generated_at"].replace("Z","+00:00"))
              due=(dt.datetime.now(dt.timezone.utc)-last).total_seconds()>=45*60
          manual=os.environ.get("FORCE_RESCAN","false").lower()=="true"
          retry=done and failed>0 and (due or os.environ.get("GITHUB_EVENT_NAME")=="push") and not manual
          enabled=not done or manual or retry
          with open(os.environ["GITHUB_OUTPUT"],"a") as fp:
              fp.write("run_scan="+str(enabled).lower()+"\n")
              fp.write("retry_unavailable="+str(retry).lower()+"\n")
          print("Full initial catalogue coverage:",done,"; unresolved failures:",failed,
                "; recovery due:",due,"; retry:",retry,"; run scan:",enabled)
          PY
      - name: Set up Python 3.12
        if: steps.coverage_gate.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CCXT public exchange adapter
        if: steps.coverage_gate.outputs.run_scan == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet 'ccxt==4.5.81'
      - name: Test no-lookahead, per-venue fees and market coverage
        if: steps.coverage_gate.outputs.run_scan == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile cryptex/overnight/wide_scan.py cryptex/overnight/forward_venue.py
          python3 -m unittest discover -s cryptex/overnight/tests -p test_wide_scan.py -v
          python3 -m unittest discover -s cryptex/overnight/tests -p test_forward_venue.py -v
      - name: Read genuine 5-minute OHLCV across five venues, then test
        if: steps.coverage_gate.outputs.run_scan == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CRYPTEX_FORCE_RESCAN: ${{ inputs.force_rescan }}
        run: |
          extra=()
          if [ "$CRYPTEX_FORCE_RESCAN" = "true" ]; then extra+=(--rescan); fi
          if [ "${{ steps.coverage_gate.outputs.retry_unavailable }}" = "true" ]; then extra+=(--retry-unavailable); fi
          python3 cryptex/overnight/wide_scan.py \
            --catalog cryptex/overnight/data/ccxt_universe.json \
            --out wide-output/cryptex/overnight/data \
            --per-venue 85 "${extra[@]}"
      - name: Check paper-only output and export visible coverage
        if: steps.coverage_gate.outputs.run_scan == 'true'
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("wide-output/cryptex/overnight/data/wide_scan_report.json")
          a=json.loads(p.read_text())
          assert a["mode"]=="PAPER_ONLY" and a["not_real_orders"] is True
          assert len(a["venues"])==5
          assert a["unique_tested_venue_pairs"] >= a["unique_ohlcv_validated_pairs"]
          assert a["last_batch"]["attempted"]>0
          print("CCXT listing count (not tested):",a["discovered_listing_total"])
          print("Actual OHLCV attempted:",a["unique_tested_venue_pairs"])
          print("Validated historical 5m OHLCV:",a["unique_ohlcv_validated_pairs"])
          print("Latest failures still needing retry:",a.get("latest_unavailable_pairs"))
          print("Contemporary market spread snapshots:",a.get("current_spread_snapshots",0))
          print("Latest API calls:",a["last_batch"])
          print("No orders, no wallets, no inferred data.")
          PY
      - name: Commit only wide research results, never the money accounts
        if: steps.coverage_gate.outputs.run_scan == 'true'
        run: |
          cd wide-output
          git config user.name "cryptex-wide-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cryptex/overnight/data/wide_scan_state.json
          git add -f cryptex/overnight/data/wide_scan_report.json
          git add -f cryptex/overnight/data/wide_scan_report.md
          git add -f cryptex/overnight/data/wide_scan_market_results.csv
          git add -f cryptex/overnight/data/forward_venue_state.json
          git add -f cryptex/overnight/data/forward_venue_report.json
          git add -f cryptex/overnight/data/forward_venue_report.md
          if git diff --cached --quiet; then
            echo "No market research changes."
            exit 0
          fi
          git commit -m "research: record CCXT real-candle tested venue-pairs [skip ci]"
          git push origin HEAD:cryptex-wide-market-research
      - name: Bounded follow-on scan until every listed venue/pair was ATTEMPTED
        if: success() && steps.coverage_gate.outputs.run_scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRYPTEX_EVENT: ${{ github.event_name }}
          CRYPTEX_AUTOPILOT: ${{ inputs.autopilot }}
          CRYPTEX_HOP: ${{ inputs.hop }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          event=os.environ.get("CRYPTEX_EVENT","")
          auto=os.environ.get("CRYPTEX_AUTOPILOT","false").lower()=="true"
          hop=int(os.environ.get("CRYPTEX_HOP") or 0)
          # Never launch a limitless chain; GitHub Actions can consume billed minutes.
          MAX_HOPS=34
          source=pathlib.Path("wide-output/cryptex/overnight/data/wide_scan_report.json")
          r=json.loads(source.read_text())
          assert r["mode"]=="PAPER_ONLY" and r["not_real_orders"]
          attempted=int(r["unique_tested_venue_pairs"])
          total=int(r["discovered_listing_total"])
          if attempted>=total:
              print(f"Completed first-pass attempt of all {total} discovered venue pairs. No further scan dispatch.")
              raise SystemExit(0)
          if hop>=MAX_HOPS:
              print(f"Stopped after {MAX_HOPS} continuation hops; native cron can finish remaining {total-attempted}.")
              raise SystemExit(0)
          if event=="schedule":
              print("Routine scheduled batch finished; do not create a competing autopilot chain.")
              raise SystemExit(0)
          if event not in ("push","workflow_dispatch") or (event=="workflow_dispatch" and not auto):
              print("One-shot dispatch. No autopilot requested.")
              raise SystemExit(0)
          cmd=["gh","api","-X","POST",f"repos/{os.environ['GH_REPO']}/actions/workflows/cryptex-wide-scan.yml/dispatches",
               "-f","ref=main","-f","inputs[autopilot]=true",
               "-f",f"inputs[hop]={hop+1}"]
          subprocess.run(cmd,check=True,timeout=30)
          print(f"Scheduled next bounded paper scan {hop+1}/{MAX_HOPS}, attempted {attempted}/{total}")
          PY
